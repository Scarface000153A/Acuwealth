services:
  - type: web
    name: acuwealth
    runtime: python
    buildCommand: apt-get update -y && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
